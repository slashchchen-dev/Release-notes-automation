name: Release Note Automation

# 定義觸發條件
on:
  workflow_dispatch:
    # 定義從外部（如 Google Apps Script）傳入的參數
    inputs:
      version:
        description: 'Release Version (e.g., v4.15.0)'
        required: true
      master_task:
        description: 'ClickUp Master Task ID'
        required: true

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出程式碼
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # 開啟快取以加速後續執行

      # 3. 安裝必要套件
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. 從 GitHub Secrets 還原 Service Account 憑證
      # 這步會現場產生程式需要的 credentials.json
      - name: Restore Service Account Credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      # 5. 執行 Python 腳本
      # 這裡透過 env 將 Secrets 傳遞給程式內部的 os.getenv()
      - name: Execute Release Note Script
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python "Release note automation.py" --version "${{ github.event.inputs.version }}" --master_task "${{ github.event.inputs.master_task }}"

      # 6. (選配) 如果執行失敗，可以在 Actions 介面看到提示
      - name: Check Status
        if: failure()
        run: echo "❌ 執行失敗，請檢查 Log 紀錄。"
